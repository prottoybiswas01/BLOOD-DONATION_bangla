name: Build Android APK

on:
  push:
    branches:
      - master
      - feature/native-android-secure
      - feature/in-app-update-and-polling-sync
    paths:
      - 'mobile/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Standalone Android APK
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'mobile/package.json'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Mobile Dependencies
        run: |
          cd mobile
          npm install

      - name: Prebuild Native Android Project
        run: |
          cd mobile
          npx expo prebuild --platform android --clean

      - name: Setup Gradle Build Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          gradle-home-cache-cleanup: true

      - name: Configure Android Release Signing and Optimization
        run: |
          node mobile/scripts/configure-release.js
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build Standalone Release APK with Gradle
        run: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --build-cache

      - name: Verify Standalone Bundle and Signature Integrity
        run: |
          echo "=== Verifying APK Release Artifact ==="
          ls -lh mobile/android/app/build/outputs/apk/release/
          
          # 1. Guarantee that index.android.bundle is physically bundled inside APK
          unzip -l mobile/android/app/build/outputs/apk/release/app-release.apk | grep "assets/index.android.bundle"
          echo "✓ JavaScript Bundle (Hermes) verified inside APK assets!"

          mkdir -p build-output
          cp mobile/android/app/build/outputs/apk/release/app-release.apk build-output/blood-donation-bangla.apk

          # 2. Check and log SHA-256 artifact hash
          echo "=== Artifact SHA-256 Checksum ==="
          sha256sum build-output/blood-donation-bangla.apk

          # 3. Verify and print X.509 certificate fingerprint
          echo "=== Certificate Fingerprint ==="
          keytool -printcert -jarfile build-output/blood-donation-bangla.apk

      - name: Extract App Version and Build Metadata
        id: app_meta
        run: |
          APP_VER=$(node -p "require('./mobile/app.json').expo.version")
          APP_CODE=$(node -p "require('./mobile/app.json').expo.android.versionCode")
          echo "version=${APP_VER}" >> $GITHUB_OUTPUT
          echo "code=${APP_CODE}" >> $GITHUB_OUTPUT
          echo "tag=v${APP_VER}" >> $GITHUB_OUTPUT

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: blood-donation-bangla-apk-${{ steps.app_meta.outputs.version }}
          path: build-output/blood-donation-bangla.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: ${{ steps.app_meta.outputs.tag }}
          name: "রক্তদান বাংলাদেশ Android v${{ steps.app_meta.outputs.version }} (Build ${{ steps.app_meta.outputs.code }})"
          body: |
            ## বাংলাদেশ রক্তদান প্ল্যাটফর্ম — অফিসিয়াল নেটিভ অ্যান্ড্রয়েড অ্যাপ
            - **সংস্করণ**: ${{ steps.app_meta.outputs.version }} (Build ${{ steps.app_meta.outputs.code }})
            - **প্যাকেজ**: org.bloodbd.app
            - **স্ট্যান্ডঅ্যালোন মোড**: সম্পূর্ণ অফলাইন ও প্রোডাকশন রেডি (Hermes AOT Pre-compiled Bytecode)
            - **সমর্থিত আর্কিটেকচার**: ARM64-v8a এবং armeabi-v7a (বাংলাদেশের ১০০% অ্যান্ড্রয়েড স্মার্টফোনের উপযোগী)
            - **সরাসরি ডাউনলোড লিঙ্ক**: [blood-donation-bangla.apk](https://github.com/${{ github.repository }}/releases/download/${{ steps.app_meta.outputs.tag }}/blood-donation-bangla.apk)
          files: build-output/blood-donation-bangla.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
