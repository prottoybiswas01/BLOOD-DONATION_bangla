name: Build Android APK

on:
  push:
    branches:
      - master
    paths:
      - 'mobile/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Standalone Android APK
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'mobile/package.json'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Mobile Dependencies
        run: |
          cd mobile
          npm install

      - name: Prebuild Native Android Project
        run: |
          cd mobile
          npx expo prebuild --platform android --clean

      - name: Build Android APK with Gradle
        run: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename and Prepare APK Artifact
        run: |
          mkdir -p build-output
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk build-output/blood-donation-bangla.apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: blood-donation-bangla-apk
          path: build-output/blood-donation-bangla.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.0.0
          name: "রক্তদান বাংলাদেশ Android v1.0.0 Release"
          body: |
            ## বাংলাদেশ রক্তদান প্ল্যাটফর্ম — অফিসিয়াল নেটিভ অ্যান্ড্রয়েড অ্যাপ
            - সংস্করণ: 1.0.0 (Build 1)
            - প্যাকেজ: org.bloodbd.app
            - সরাসরি ডাউনলোড করুন: [blood-donation-bangla.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.0/blood-donation-bangla.apk)
          files: build-output/blood-donation-bangla.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
